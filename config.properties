# =============================================================================
# 👑 PHAROAH - Centralized System Configuration
# =============================================================================
# Edit this file to customize database credentials, python path, and UI styling.
# Environment variables will override any values configured here.
# =============================================================================

# --- Database Connection (MySQL 8.0) ---
db.type=mysql
db.driver=com.mysql.cj.jdbc.Driver
db.url=jdbc:mysql://localhost:3306/pharoah_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
db.user=root
db.password=i@mvarij999@

# --- Database Fallback (SQLite used if MySQL server is offline) ---
db.fallback.sqlite=jdbc:sqlite:pharoah.db

# --- Python Agent Swarm Runtime ---
# Can be "python", "python3", "py", or absolute path e.g. "C:\\Python311\\python.exe"
python.command=python

# --- Terminal UI Options ---
# Enable or disable ANSI colors in terminal (true/false)
ui.ansi.colors=true

# --- Pluggable AI Engine ---
# Options: MOCK_HEURISTIC, GEMINI_API, OLLAMA
ai.provider=MOCK_HEURISTIC
ai.endpoint=http://localhost:11434/api/generate
